server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = / {
    try_files /index.html =404;
  }

  location / {
    try_files $uri @spa;
  }

  location @spa {
    rewrite ^ /index.html break;
  }

  location /api/ {
    proxy_pass ${API_UPSTREAM};
  }

  location /ws {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
