name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache-dependency-path: server/go.sum }
      - name: Go format
        run: test -z "$(gofmt -l server)"
      - name: Go test and vet
        working-directory: server
        run: go test ./... && go vet ./...
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - name: Dashboard build
        working-directory: dashboard
        run: npm ci && npm run build
      - name: Compose validation
        run: docker compose config --quiet

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.10.5' }
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
